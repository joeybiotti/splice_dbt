name: dbt CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Run ingest script
        run: python scripts/ingest.py

      - name: Set up dbt profile (DuckDB)
        run: |
          mkdir -p $HOME/.dbt
          # Use a file-based DuckDB in the runner temp directory so artifacts persist during the job.
          DB_PATH="${RUNNER_TEMP:-/tmp}/splice.duckdb"
          printf 'splice:\n  target: ci\n  outputs:\n    ci:\n      type: duckdb\n      path: %s\n      threads: 1\n' "$DB_PATH" > $HOME/.dbt/profiles.yml
          echo "Wrote DBT profile to $HOME/.dbt/profiles.yml (duckdb path=$DB_PATH)"

      - name: Run dbt build
        run: dbt build