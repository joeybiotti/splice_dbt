name: dbt CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      - name: Run ingest script
        run: python scripts/ingest.py

      - name: Set up dbt profile
        run: |
          mkdir -p ./ci_profile
          cat <<EOF > ./ci_profile/profiles.yml
          splice_dbt:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: splice_warehouse.duckdb
                threads: 4
          EOF

      - name: Run dbt build
        run: dbt build --profiles-dir ./ci_profile